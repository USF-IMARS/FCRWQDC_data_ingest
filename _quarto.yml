project:
  type: website
  pre-render: 
    - pre_render/provider_reports.R
    - pre_render/analyte_reports.R
  render:
    - index.qmd
    - seacar-check.qmd
    - analyte_reports/*.qmd
    - provider_reports/*.qmd
  post-render:
    - scripts/rm-csv-files.sh
    
website:
  title: "WIN_data_ingest"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - analyte_reports/analyte_reports.qmd
      - provider_reports/provider_reports.qmd
      - href: https://github.com/USF-IMaRS/WIN_data_ingest
        text: Source Code on GitHub
      - href: seacar-check.qmd
        text: SEACAR Export
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-fold: true
    message: false
    warning: false


